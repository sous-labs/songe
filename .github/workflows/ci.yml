name: CI

# Runs on every pull request (main is protected: changes land through one),
# before a release (release.yml calls it for v* tags), or by hand.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts .github/ci packaging/homebrew
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Install smoke test (built package, fake model server)
        shell: bash
        run: |
          uv venv smoke-venv --python 3.12
          uv pip install --python smoke-venv dist/*.whl
          bin=smoke-venv/bin; [ -d smoke-venv/Scripts ] && bin=smoke-venv/Scripts
          "$bin/python" .github/ci/smoke.py --songe "$bin/songe"

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Verify Apple Silicon runner
        run: uv run --no-project python -c "import platform; assert platform.machine() == 'arm64'"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check src tests scripts .github/ci packaging/homebrew
      - run: uv run --no-sync pytest
      - run: uv build
      - run: uv run --no-sync songe --version
      - name: Install smoke test (built package, fake model server)
        shell: bash
        run: |
          uv venv smoke-venv --python 3.12
          uv pip install --python smoke-venv dist/*.whl
          bin=smoke-venv/bin; [ -d smoke-venv/Scripts ] && bin=smoke-venv/Scripts
          "$bin/python" .github/ci/smoke.py --songe "$bin/songe"

  # The dashboard in a real (headless) browser: it must render the model
  # without script errors. Runs next to the tests, so it adds no wait.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv build --wheel
      - run: |
          uv venv smoke-venv --python 3.12
          uv pip install --python smoke-venv dist/*.whl playwright
          smoke-venv/bin/python -m playwright install --with-deps --only-shell chromium
      - run: smoke-venv/bin/python .github/ci/smoke.py --songe smoke-venv/bin/songe --browser
