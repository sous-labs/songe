<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Songe</title>
  <link rel="preload" href="/assets/outfit.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/next.css">
  <script src="/assets/next.js" defer></script>
</head>
<body>
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="page">
    <aside class="rail">
      <p class="wordmark">Songe</p>
      <div id="nav"></div>
      <section class="status" aria-label="What Songe is doing">
        <p><span class="label">Now</span> <span id="now">Connecting to Songe</span></p>
        <p><span class="label">Next</span> <span id="next"></span></p>
        <p id="gpu-line" hidden><span class="label">GPU</span> <span id="gpu"></span></p>
        <p><span class="label">Paused</span> <span id="paused"></span></p>
      </section>
      <p class="signature">Learning stays on this machine.</p>
    </aside>
    <main id="models"></main>
  </div>
</body>
</html>
